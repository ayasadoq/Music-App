<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle != null ? pageTitle : 'Ecole de Musique'}">Ecole de Musique</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" th:fragment="navbar(activePage)">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-music-note-beamed me-2"></i>Ecole de Musique</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" th:href="@{/}">Dashboard</a>
                <a class="nav-link" th:classappend="${activePage == 'instruments'} ? 'active'" th:href="@{/instruments}">Instruments</a>
                <a class="nav-link" th:classappend="${activePage == 'profs'} ? 'active'" th:href="@{/profs}">Professeurs</a>
                <a class="nav-link" th:classappend="${activePage == 'cours'} ? 'active'" th:href="@{/cours}">Cours</a>
                <a class="nav-link" th:classappend="${activePage == 'statistiques'} ? 'active'" th:href="@{/statistiques}">Statistiques</a>
                <span class="user-chip ms-lg-3">
                    <span class="user-avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">?</span>
                    <span class="small user-name" sec:authentication="name"></span>
                </span>
                <span class="badge role-badge text-bg-danger" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="badge role-badge text-bg-success" sec:authorize="hasRole('VISITEUR')">VISITEUR</span>
                <form th:action="@{/logout}" method="post" class="ms-lg-2">
                    <button type="submit" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Deconnexion</button>
                </form>
            </div>
        </div>
    </div>
</nav>
<main th:fragment="content">
</main>
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1080" th:if="${success}">
    <div class="toast align-items-center text-bg-success border-0" th:classappend="${toastType != null ? ' text-bg-' + toastType : ''}" role="alert">
        <div class="d-flex">
            <div class="toast-body" th:text="${'✅ ' + success}">✅ Ajouté avec succès !</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.toast').forEach((toast) => {
            bootstrap.Toast.getOrCreateInstance(toast, { delay: 3000 }).show();
        });

        gsap.from('body', { opacity: 0, duration: 0.4 });
        gsap.from('.navbar', { y: -60, duration: 0.6, ease: 'power2.out' });
        gsap.from('.navbar .nav-link', { opacity: 0, y: -10, duration: 0.35, stagger: 0.1, delay: 0.2 });

        document.querySelectorAll('.btn').forEach((button) => {
            button.style.position = 'relative';
            button.style.overflow = 'hidden';
            button.addEventListener('click', (event) => {
                const ripple = document.createElement('span');
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.position = 'absolute';
                ripple.style.width = `${size}px`;
                ripple.style.height = `${size}px`;
                ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
                ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.45)';
                ripple.style.pointerEvents = 'none';
                button.appendChild(ripple);
                gsap.fromTo(ripple, { scale: 0, opacity: 0.8 }, {
                    scale: 2,
                    opacity: 0,
                    duration: 0.55,
                    ease: 'power2.out',
                    onComplete: () => ripple.remove()
                });
            });
        });
    });
</script>
</body>
</html>
