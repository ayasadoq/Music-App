<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cours</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{layout :: navbar('cours')}"></nav>
<main class="page-shell">
    <div class="container">
        <div class="d-flex flex-wrap gap-3 align-items-center justify-content-between mb-4">
            <h1 class="page-title mb-0">Cours</h1>
            <button class="btn btn-music" data-bs-toggle="modal" data-bs-target="#addCours" sec:authorize="hasRole('ADMIN')"><i class="bi bi-plus-circle me-2"></i>Ajouter</button>
        </div>
        <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080" th:if="${success}">
            <div class="toast align-items-center text-bg-success border-0" th:classappend="${toastType != null ? ' text-bg-' + toastType : ''}" role="alert">
                <div class="d-flex">
                    <div class="toast-body" th:text="${'✅ ' + success}">✅ Ajouté avec succès !</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>
        <form class="panel p-3 mb-4" method="get" th:action="@{/cours}">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label">Jour</label>
                    <select class="form-select" name="jour">
                        <option value="">Tous</option>
                        <option th:each="jour : ${jours}" th:value="${jour}" th:text="${jour}" th:selected="${jour == selectedJour}"></option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Niveau</label>
                    <select class="form-select" name="niveau">
                        <option value="">Tous</option>
                        <option th:each="niveau : ${niveaux}" th:value="${niveau}" th:text="${niveau}" th:selected="${niveau == selectedNiveau}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn btn-outline-primary">Filtrer</button>
                </div>
            </div>
        </form>
        <div class="panel table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Jour</th><th>Heure</th><th>Duree</th><th>Niveau</th><th>Professeur</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="unCours : ${listeCours}">
                    <td th:text="${unCours.jour}"></td>
                    <td th:text="${unCours.heureDebut}"></td>
                    <td th:text="${unCours.dureeMin + ' min'}"></td>
                    <td><span class="badge badge-soft"
                              th:classappend="${unCours.niveau.name() == 'DEBUTANT' ? ' badge-green' : (unCours.niveau.name() == 'INTERMEDIAIRE' ? ' badge-orange' : ' badge-red')}"
                              th:text="${unCours.niveau}"></span></td>
                    <td th:text="${unCours.prof != null ? unCours.prof.nom : '-'}"></td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary btn-icon" data-bs-toggle="modal" th:data-bs-target="${'#editCours' + unCours.id}" sec:authorize="hasRole('ADMIN')" title="Modifier"><i class="bi bi-pencil-square"></i></button>
                        <button type="button" class="btn btn-danger btn-sm btn-icon"
                                data-bs-toggle="modal"
                                data-bs-target="#confirmModal"
                                th:attr="data-id=${unCours.id}, data-nom=${unCours.jour + ' ' + unCours.heureDebut}"
                                sec:authorize="hasRole('ADMIN')"
                                title="Supprimer">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal fade" id="addCours" tabindex="-1" sec:authorize="hasRole('ADMIN')">
    <div class="modal-dialog">
        <form class="modal-content" method="post" th:action="@{/cours}" th:object="${cours}">
            <div class="modal-header"><h2 class="modal-title fs-5">Ajouter un cours</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <label class="form-label">Jour</label><select class="form-select" th:field="*{jour}" required><option th:each="jour : ${jours}" th:value="${jour}" th:text="${jour}"></option></select>
                <span th:if="${#fields.hasErrors('jour')}" th:errors="*{jour}" class="text-danger small"></span>
                <label class="form-label mt-3">Heure de debut</label><input class="form-control" type="time" th:field="*{heureDebut}" required>
                <span th:if="${#fields.hasErrors('heureDebut')}" th:errors="*{heureDebut}" class="text-danger small"></span>
                <label class="form-label mt-3">Duree en minutes</label><input class="form-control" type="number" min="15" max="180" step="15" th:field="*{dureeMin}" required>
                <span th:if="${#fields.hasErrors('dureeMin')}" th:errors="*{dureeMin}" class="text-danger small"></span>
                <label class="form-label mt-3">Niveau</label><select class="form-select" th:field="*{niveau}" required><option th:each="niveau : ${niveaux}" th:value="${niveau}" th:text="${niveau}"></option></select>
                <span th:if="${#fields.hasErrors('niveau')}" th:errors="*{niveau}" class="text-danger small"></span>
                <label class="form-label mt-3">Professeur</label><select class="form-select" th:field="*{prof.id}" required><option th:each="prof : ${profs}" th:value="${prof.id}" th:text="${prof.nom + ' - ' + prof.specialite}"></option></select>
                <span th:if="${#fields.hasErrors('prof')}" th:errors="*{prof}" class="text-danger small"></span>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Annuler</button><button class="btn btn-music">Enregistrer</button></div>
        </form>
    </div>
</div>

<div th:each="unCours : ${listeCours}" class="modal fade" th:id="${'editCours' + unCours.id}" tabindex="-1" sec:authorize="hasRole('ADMIN')">
    <div class="modal-dialog">
        <form class="modal-content" method="post" th:action="@{/cours/{id}(id=${unCours.id})}" th:object="${cours}">
            <div class="modal-header"><h2 class="modal-title fs-5">Modifier un cours</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <label class="form-label">Jour</label><select class="form-select" th:field="*{jour}" required><option th:each="jour : ${jours}" th:value="${jour}" th:text="${jour}"></option></select>
                <span th:if="${#fields.hasErrors('jour')}" th:errors="*{jour}" class="text-danger small"></span>
                <label class="form-label mt-3">Heure de debut</label><input class="form-control" type="time" th:field="*{heureDebut}" required>
                <span th:if="${#fields.hasErrors('heureDebut')}" th:errors="*{heureDebut}" class="text-danger small"></span>
                <label class="form-label mt-3">Duree en minutes</label><input class="form-control" type="number" min="15" max="180" step="15" th:field="*{dureeMin}" required>
                <span th:if="${#fields.hasErrors('dureeMin')}" th:errors="*{dureeMin}" class="text-danger small"></span>
                <label class="form-label mt-3">Niveau</label><select class="form-select" th:field="*{niveau}" required><option th:each="niveau : ${niveaux}" th:value="${niveau}" th:text="${niveau}"></option></select>
                <span th:if="${#fields.hasErrors('niveau')}" th:errors="*{niveau}" class="text-danger small"></span>
                <label class="form-label mt-3">Professeur</label><select class="form-select" th:field="*{prof.id}" required><option th:each="prof : ${profs}" th:value="${prof.id}" th:text="${prof.nom + ' - ' + prof.specialite}"></option></select>
                <span th:if="${#fields.hasErrors('prof')}" th:errors="*{prof}" class="text-danger small"></span>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Annuler</button><button class="btn btn-music">Enregistrer</button></div>
        </form>
    </div>
</div>
<div class="modal fade" id="confirmModal" tabindex="-1" sec:authorize="hasRole('ADMIN')">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h2 class="modal-title fs-5">Confirmer la suppression</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">Êtes-vous sûr de vouloir supprimer <span id="confirmDeleteName"></span> ?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <form id="confirmDeleteForm" method="post"><button class="btn btn-danger">Supprimer</button></form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.toast').forEach((toast) => {
            bootstrap.Toast.getOrCreateInstance(toast, { delay: 3000 }).show();
        });

        const confirmModal = document.getElementById('confirmModal');
        if (confirmModal) {
            confirmModal.addEventListener('show.bs.modal', (event) => {
                const button = event.relatedTarget;
                document.getElementById('confirmDeleteName').textContent = button.getAttribute('data-nom');
                document.getElementById('confirmDeleteForm').action = `/cours/${button.getAttribute('data-id')}/delete`;
            });
        }

        gsap.from('body', { opacity: 0, duration: 0.4 });
        gsap.from('tbody tr', { opacity: 0, y: 20, duration: 0.35, stagger: 0.08, ease: 'power2.out' });

        document.querySelectorAll('.btn-music, .btn-outline-primary, .btn-outline-danger').forEach((button) => {
            button.addEventListener('mouseenter', () => gsap.to(button, { scale: 1.05, duration: 0.18, ease: 'power2.out' }));
            button.addEventListener('mouseleave', () => gsap.to(button, { scale: 1, duration: 0.18, ease: 'power2.out' }));
        });

        document.querySelectorAll('.btn').forEach((button) => {
            button.style.position = 'relative';
            button.style.overflow = 'hidden';
            button.addEventListener('click', (event) => {
                const ripple = document.createElement('span');
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.position = 'absolute';
                ripple.style.width = `${size}px`;
                ripple.style.height = `${size}px`;
                ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
                ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.45)';
                ripple.style.pointerEvents = 'none';
                button.appendChild(ripple);
                gsap.fromTo(ripple, { scale: 0, opacity: 0.8 }, {
                    scale: 2,
                    opacity: 0,
                    duration: 0.55,
                    ease: 'power2.out',
                    onComplete: () => ripple.remove()
                });
            });
        });
    });
</script>
</body>
</html>
