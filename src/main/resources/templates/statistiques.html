<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statistiques</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{layout :: navbar('statistiques')}"></nav>
<main class="page-shell">
    <div class="container">
        <h1 class="page-title mb-3">Statistiques</h1>
        <div class="row g-3">
            <div class="col-md-6">
                <div class="card chart-card">
                    <div class="card-body">
                        <h2 class="fs-5 mb-3 gradient-title">Cours par jour</h2>
                        <div class="chart-canvas-wrap">
                            <canvas id="coursChart" style="max-height: 280px;"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card chart-card">
                    <div class="card-body">
                        <h2 class="fs-5 mb-3 gradient-title">Instruments par famille</h2>
                        <div class="chart-canvas-wrap">
                            <canvas id="instrumentChart" style="max-height: 280px;"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    const coursLabels = /*[[${coursLabels}]]*/ [];
    const coursValues = /*[[${coursValues}]]*/ [];
    const instrumentLabels = /*[[${instrumentLabels}]]*/ [];
    const instrumentValues = /*[[${instrumentValues}]]*/ [];

    new Chart(document.getElementById('coursChart'), {
        type: 'bar',
        data: {
            labels: coursLabels,
            datasets: [{
                label: 'Cours',
                data: coursValues,
                backgroundColor: ['#6C63FF', '#7C72FF', '#FF6584', '#8B5CF6', '#48BB78', '#63B3ED', '#F6AD55'],
                borderColor: '#C7C4FF',
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#FFFFFF' } } },
            scales: {
                x: { ticks: { color: '#A0AEC0' }, grid: { color: 'rgba(255, 255, 255, 0.06)' } },
                y: { beginAtZero: true, ticks: { precision: 0, color: '#A0AEC0' }, grid: { color: 'rgba(255, 255, 255, 0.06)' } }
            }
        }
    });

    new Chart(document.getElementById('instrumentChart'), {
        type: 'doughnut',
        data: {
            labels: instrumentLabels,
            datasets: [{
                data: instrumentValues,
                backgroundColor: ['#48BB78', '#63B3ED', '#F6AD55', '#6C63FF', '#FF6584'],
                borderColor: '#1A1A2E',
                borderWidth: 3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#FFFFFF' } } }
        }
    });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        gsap.from('body', { opacity: 0, duration: 0.4 });
        gsap.from('.page-title', { opacity: 0, x: -50, duration: 0.55, ease: 'power2.out' });
        gsap.from('.chart-card', { opacity: 0, scale: 0.8, duration: 0.5, stagger: 0.15, ease: 'back.out(1.4)' });

        document.querySelectorAll('.btn').forEach((button) => {
            button.style.position = 'relative';
            button.style.overflow = 'hidden';
            button.addEventListener('click', (event) => {
                const ripple = document.createElement('span');
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.position = 'absolute';
                ripple.style.width = `${size}px`;
                ripple.style.height = `${size}px`;
                ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
                ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.45)';
                ripple.style.pointerEvents = 'none';
                button.appendChild(ripple);
                gsap.fromTo(ripple, { scale: 0, opacity: 0.8 }, {
                    scale: 2,
                    opacity: 0,
                    duration: 0.55,
                    ease: 'power2.out',
                    onComplete: () => ripple.remove()
                });
            });
        });
    });
</script>
</body>
</html>
