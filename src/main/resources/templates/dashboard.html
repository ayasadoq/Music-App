<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ecole de Musique</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{layout :: navbar('dashboard')}"></nav>

<main class="page-shell">
    <div class="container">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="page-title mb-0">Dashboard</h1>
        </div>
        <div class="row g-4">
            <div class="col-md-6 col-xl-3">
                <div class="stat-card">
                    <div class="stat-icon stat-icon-violet">🎵</div>
                    <div class="stat-label mb-2">Total Cours</div>
                    <div class="stat-value" th:text="${nbCours}">0</div>
                </div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="stat-card">
                    <div class="stat-icon stat-icon-blue">👨‍🏫</div>
                    <div class="stat-label mb-2">Professeurs</div>
                    <div class="stat-value" th:text="${nbProfs}">0</div>
                </div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="stat-card">
                    <div class="stat-icon stat-icon-pink">🎸</div>
                    <div class="stat-label mb-2">Instruments</div>
                    <div class="stat-value" th:text="${nbInstruments}">0</div>
                </div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="stat-card">
                    <div class="stat-icon stat-icon-green">📅</div>
                    <div class="stat-label mb-2">Cours cette semaine</div>
                    <div class="stat-value" th:text="${nbCours}">0</div>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        gsap.from('body', { opacity: 0, duration: 0.4 });
        gsap.from('.stat-card', { opacity: 0, y: 30, duration: 0.55, stagger: 0.2, ease: 'power2.out' });

        document.querySelectorAll('.stat-value').forEach((element) => {
            const target = Number.parseInt(element.textContent.trim(), 10);
            if (Number.isNaN(target)) {
                return;
            }

            const counter = { value: 0 };
            gsap.to(counter, {
                value: target,
                duration: 1.2,
                ease: 'power2.out',
                onUpdate: () => {
                    element.textContent = Math.round(counter.value);
                }
            });
        });

        document.querySelectorAll('.btn').forEach((button) => {
            button.style.position = 'relative';
            button.style.overflow = 'hidden';
            button.addEventListener('click', (event) => {
                const ripple = document.createElement('span');
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.position = 'absolute';
                ripple.style.width = `${size}px`;
                ripple.style.height = `${size}px`;
                ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
                ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.45)';
                ripple.style.pointerEvents = 'none';
                button.appendChild(ripple);
                gsap.fromTo(ripple, { scale: 0, opacity: 0.8 }, {
                    scale: 2,
                    opacity: 0,
                    duration: 0.55,
                    ease: 'power2.out',
                    onComplete: () => ripple.remove()
                });
            });
        });
    });
</script>
</body>
</html>
