<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instruments</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{layout :: navbar('instruments')}"></nav>
<main class="page-shell">
    <div class="container">
        <div class="d-flex flex-wrap gap-3 align-items-center justify-content-between mb-4">
            <h1 class="page-title mb-0">Instruments</h1>
            <button class="btn btn-music" data-bs-toggle="modal" data-bs-target="#addInstrument" sec:authorize="hasRole('ADMIN')"><i class="bi bi-plus-circle me-2"></i>Ajouter</button>
        </div>
        <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080" th:if="${success}">
            <div class="toast align-items-center text-bg-success border-0" th:classappend="${toastType != null ? ' text-bg-' + toastType : ''}" role="alert">
                <div class="d-flex">
                    <div class="toast-body" th:text="${'✅ ' + success}">✅ Ajouté avec succès !</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>
        <form class="panel p-3 mb-4" method="get" th:action="@{/instruments}">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label">Famille</label>
                    <select class="form-select" name="famille">
                        <option value="">Toutes</option>
                        <option th:each="famille : ${familles}" th:value="${famille}" th:text="${famille}" th:selected="${famille == selectedFamille}"></option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Disponibilite</label>
                    <select class="form-select" name="disponibilite">
                        <option value="">Toutes</option>
                        <option value="true" th:selected="${selectedDisponibilite == true}">Disponible</option>
                        <option value="false" th:selected="${selectedDisponibilite == false}">Indisponible</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn btn-outline-primary">Filtrer</button>
                </div>
            </div>
        </form>
        <div class="panel table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Nom</th><th>Famille</th><th>Disponibilite</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="instrument : ${instruments}">
                    <td th:text="${instrument.nom}"></td>
                    <td><span class="badge badge-soft"
                              th:classappend="${instrument.famille.name() == 'CORDES' ? ' badge-green' : (instrument.famille.name() == 'VENTS' ? ' badge-blue' : (instrument.famille.name() == 'PERCUSSIONS' ? ' badge-orange' : ' badge-violet'))}"
                              th:text="${instrument.famille}"></span></td>
                    <td><span class="badge badge-soft"
                              th:classappend="${instrument.disponibilite ? ' badge-green' : ' badge-red'}"
                              th:text="${instrument.disponibilite ? 'Disponible' : 'Non disponible'}"></span></td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary btn-icon" data-bs-toggle="modal" th:data-bs-target="${'#editInstrument' + instrument.id}" sec:authorize="hasRole('ADMIN')" title="Modifier"><i class="bi bi-pencil-square"></i></button>
                        <button type="button" class="btn btn-danger btn-sm btn-icon"
                                data-bs-toggle="modal"
                                data-bs-target="#confirmModal"
                                th:attr="data-id=${instrument.id}, data-nom=${instrument.nom}"
                                sec:authorize="hasRole('ADMIN')"
                                title="Supprimer">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal fade" id="addInstrument" tabindex="-1" sec:authorize="hasRole('ADMIN')">
    <div class="modal-dialog">
        <form class="modal-content" method="post" th:action="@{/instruments}" th:object="${instrument}">
            <div class="modal-header"><h2 class="modal-title fs-5">Ajouter un instrument</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <label class="form-label">Nom</label><input class="form-control" th:field="*{nom}" required>
                <span th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" class="text-danger small"></span>
                <label class="form-label mt-3">Famille</label><select class="form-select" th:field="*{famille}" required><option th:each="famille : ${familles}" th:value="${famille}" th:text="${famille}"></option></select>
                <span th:if="${#fields.hasErrors('famille')}" th:errors="*{famille}" class="text-danger small"></span>
                <div class="form-check mt-3"><input class="form-check-input" type="checkbox" th:field="*{disponibilite}" value="true" checked><label class="form-check-label">Disponible</label></div>
                <span th:if="${#fields.hasErrors('disponibilite')}" th:errors="*{disponibilite}" class="text-danger small"></span>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Annuler</button><button class="btn btn-music">Enregistrer</button></div>
        </form>
    </div>
</div>

<div th:each="instrument : ${instruments}" class="modal fade" th:id="${'editInstrument' + instrument.id}" tabindex="-1" sec:authorize="hasRole('ADMIN')">
    <div class="modal-dialog">
        <form class="modal-content" method="post" th:action="@{/instruments/{id}(id=${instrument.id})}" th:object="${instrument}">
            <div class="modal-header"><h2 class="modal-title fs-5">Modifier un instrument</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <label class="form-label">Nom</label><input class="form-control" th:field="*{nom}" required>
                <span th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" class="text-danger small"></span>
                <label class="form-label mt-3">Famille</label><select class="form-select" th:field="*{famille}" required><option th:each="famille : ${familles}" th:value="${famille}" th:text="${famille}"></option></select>
                <span th:if="${#fields.hasErrors('famille')}" th:errors="*{famille}" class="text-danger small"></span>
                <div class="form-check mt-3"><input class="form-check-input" type="checkbox" th:field="*{disponibilite}" value="true"><label class="form-check-label">Disponible</label></div>
                <span th:if="${#fields.hasErrors('disponibilite')}" th:errors="*{disponibilite}" class="text-danger small"></span>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Annuler</button><button class="btn btn-music">Enregistrer</button></div>
        </form>
    </div>
</div>
<div class="modal fade" id="confirmModal" tabindex="-1" sec:authorize="hasRole('ADMIN')">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h2 class="modal-title fs-5">Confirmer la suppression</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">Êtes-vous sûr de vouloir supprimer <span id="confirmDeleteName"></span> ?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <form id="confirmDeleteForm" method="post"><button class="btn btn-danger">Supprimer</button></form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.toast').forEach((toast) => {
            bootstrap.Toast.getOrCreateInstance(toast, { delay: 3000 }).show();
        });

        const confirmModal = document.getElementById('confirmModal');
        if (confirmModal) {
            confirmModal.addEventListener('show.bs.modal', (event) => {
                const button = event.relatedTarget;
                document.getElementById('confirmDeleteName').textContent = button.getAttribute('data-nom');
                document.getElementById('confirmDeleteForm').action = `/instruments/${button.getAttribute('data-id')}/delete`;
            });
        }

        gsap.from('body', { opacity: 0, duration: 0.4 });
        gsap.from('tbody tr', { opacity: 0, y: 20, duration: 0.35, stagger: 0.08, ease: 'power2.out' });

        document.querySelectorAll('.btn-music, .btn-outline-primary, .btn-outline-danger').forEach((button) => {
            button.addEventListener('mouseenter', () => gsap.to(button, { scale: 1.05, duration: 0.18, ease: 'power2.out' }));
            button.addEventListener('mouseleave', () => gsap.to(button, { scale: 1, duration: 0.18, ease: 'power2.out' }));
        });

        document.querySelectorAll('.btn').forEach((button) => {
            button.style.position = 'relative';
            button.style.overflow = 'hidden';
            button.addEventListener('click', (event) => {
                const ripple = document.createElement('span');
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.position = 'absolute';
                ripple.style.width = `${size}px`;
                ripple.style.height = `${size}px`;
                ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
                ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.45)';
                ripple.style.pointerEvents = 'none';
                button.appendChild(ripple);
                gsap.fromTo(ripple, { scale: 0, opacity: 0.8 }, {
                    scale: 2,
                    opacity: 0,
                    duration: 0.55,
                    ease: 'power2.out',
                    onComplete: () => ripple.remove()
                });
            });
        });
    });
</script>
</body>
</html>
