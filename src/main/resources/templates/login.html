<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Ecole de Musique</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="login-page">
<main class="container">
    <div class="mx-auto text-center mb-4">
        <div class="display-5 login-logo"><i class="bi bi-music-note-beamed me-2"></i>Ecole de Musique</div>
    </div>
    <div class="card login-card mx-auto">
        <div class="card-body p-4">
            <h1 class="fs-4 mb-4 text-center gradient-title">Connexion</h1>
            <div class="alert alert-danger py-2" th:if="${param.error}">
                Identifiants invalides.
            </div>
            <div class="alert alert-success py-2" th:if="${param.logout}">
                Deconnexion reussie.
            </div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Nom d'utilisateur</label>
                    <input class="form-control" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Se connecter</button>
            </form>
        </div>
    </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        gsap.from('.login-card', { opacity: 0, scale: 0.94, duration: 0.45, ease: 'power2.out' });
    });
</script>
</body>
</html>
